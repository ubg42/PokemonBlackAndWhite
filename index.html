<!DOCTYPE html>
<html>
<head>
    <title>Pokemon Black</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #game {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>

<div id="game"></div>

<script>
    EJS_player = "#game";
    EJS_core = "nds";
    EJS_pathtodata = "./data/";

    async function loadNDS() {

        const base = "./roms/Pokemon_Black.nds";

        const parts = [
            ".part01",
            ".part02",
            ".part03",
            ".part04",
            ".part05",
            ".part06",
            ".part07",
            ".part08",
            ".part09",
            ".part10",
            ".part11"
        ];

        const buffers = [];

        for (const extension of parts) {

            const url = base + extension;

            console.log("Loading:", url);

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(
                    `Failed to load ${url}: ${response.status}`
                );
            }

            const buffer = await response.arrayBuffer();

            console.log(
                "Loaded:",
                url,
                buffer.byteLength,
                "bytes"
            );

            buffers.push(buffer);
        }

        console.log("Combining ROM parts...");

        const rom = new Blob(buffers, {
            type: "application/octet-stream"
        });

        const romURL = URL.createObjectURL(rom);

        console.log("Combined ROM:", rom.size, "bytes");

        EJS_gameUrl = romURL;

        const script = document.createElement("script");

        script.src = EJS_pathtodata + "loader.js";

        document.body.appendChild(script);
    }

    loadNDS().catch(error => {
        console.error("ROM loading failed:", error);
    });
</script>

</body>
</html>
